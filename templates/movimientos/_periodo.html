{# Period toolbar. `con_moneda`: show the Pesos/Dólares toggle (keeps the period). #}
<div class="toolbar">
  {% if con_moneda %}
  <a class="pill {% if moneda == 'ARS' %}on{% endif %}" href="?moneda=ARS&desde={{ desde }}&hasta={{ hasta }}">Pesos</a>
  <a class="pill {% if moneda == 'USD' %}on{% endif %}" href="?moneda=USD&desde={{ desde }}&hasta={{ hasta }}">Dólares</a>
  {% endif %}
  <form method="get" style="display:inline-flex;align-items:center;gap:4px">
    {% if con_moneda %}<input type="hidden" name="moneda" value="{{ moneda }}">{% endif %}
    Desde <input type="month" name="desde" value="{{ desde }}">
    hasta <input type="month" name="hasta" value="{{ hasta }}">
    <button class="btn-small teal" type="submit">Ver</button>
  </form>
</div>
